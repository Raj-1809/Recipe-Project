name: iOS Build & Archive

on:
  # Run when code is pushed to the main branch
  push:
    branches: [main, master]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Archive
    runs-on: macos-latest    # Must be macOS — Xcode only runs on Apple hardware

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node / npm ────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── 3. Sync Capacitor (copies www/ into Xcode project) ──────────────────
      - name: Capacitor sync
        run: npx cap sync ios

      # ── 4. Install CocoaPods dependencies ────────────────────────────────────
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      # ── 5. Code signing setup ────────────────────────────────────────────────
      #
      #  You need to add these secrets to your GitHub repo:
      #    IOS_DIST_CERT_P12_BASE64   → base64 of your distribution cert .p12
      #    IOS_DIST_CERT_PASSWORD      → password for the .p12
      #    IOS_PROVISIONING_PROFILE_BASE64 → base64 of your .mobileprovision file
      #    KEYCHAIN_PASSWORD           → any random string (used for temp keychain)
      #
      #  How to get them:
      #    1. In Xcode → Preferences → Accounts → Manage Certificates
      #       → right-click "Apple Distribution" → Export Certificate → save as .p12
      #       → base64 encode:  base64 -i cert.p12 | pbcopy
      #    2. In developer.apple.com → Certificates, Identifiers & Profiles
      #       → Provisioning Profiles → download your App Store profile
      #       → base64 encode:  base64 -i profile.mobileprovision | pbcopy
      #
      - name: Install distribution certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode cert
          echo "$P12_BASE64" | base64 --decode > dist_cert.p12

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import cert into keychain
          security import dist_cert.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/fitmeal.mobileprovision

      # ── 6. Build & Archive ───────────────────────────────────────────────────
      - name: Build Xcode archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/FitMealPlanner.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="fitmeal" \
            archive | xcpretty

      # ── 7. Export .ipa ───────────────────────────────────────────────────────
      - name: Create ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <!-- Replace XXXXXXXXXX with your 10-character Apple Team ID -->
            <string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.fitmealplanner.app</key>
              <string>fitmeal</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/FitMealPlanner.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist | xcpretty

      # ── 8. Upload .ipa as build artifact ────────────────────────────────────
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitMealPlanner-${{ github.run_number }}.ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # ── 9. (Optional) Upload directly to TestFlight ─────────────────────────
      #  Uncomment this block once you have your App Store Connect API key ready.
      #  Add secrets: APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY
      #
      # - name: Upload to TestFlight
      #   env:
      #     APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      #     APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      #     APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      #   run: |
      #     xcrun altool --upload-app \
      #       --type ios \
      #       --file "$RUNNER_TEMP/ipa/*.ipa" \
      #       --apiKey "$APPSTORE_KEY_ID" \
      #       --apiIssuer "$APPSTORE_ISSUER_ID"
