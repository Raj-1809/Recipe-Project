    const staples = ['garlic','ginger','salt','olive oil','butter','ghee','onion','spices'];

    // Utility: group ingredients by category
    function groupByCategory(data) {
        const map = {};
        data.forEach(item => {
            const cat = item.category;
            const name = item.ingredient;
            if (!map[cat]) map[cat] = [];
            map[cat].push(name);
        });
        // sort each category
        Object.keys(map).forEach(cat => map[cat].sort());
        return map;
    }

    // Render ingredient accordions
    function renderIngredientSelection() {
        const categories = groupByCategory(ingredientsData);
        const accordion = document.getElementById('ingredientAccordion');
        let index = 0;
        for (const [category, items] of Object.entries(categories)) {
            index += 1;
            const collapseId = `collapse${index}`;
            const headingId = `heading${index}`;
            const card = document.createElement('div');
            card.className = 'accordion-item';
            card.innerHTML = `
                <h2 class="accordion-header" id="${headingId}">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="false" aria-controls="${collapseId}">
                        ${category.charAt(0).toUpperCase() + category.slice(1)}
                    </button>
                </h2>
                <div id="${collapseId}" class="accordion-collapse collapse" aria-labelledby="${headingId}" data-bs-parent="#ingredientAccordion">
                    <div class="accordion-body">
                        <div class="row">
                        ${items.map((item, idx) => {
                            const id = `${category}-${index}-${idx}`;
                            const label = item.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                            return `
                            <div class="col-6 col-md-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="${item}" id="${id}">
                                    <label class="form-check-label" for="${id}">${label}</label>
                                </div>
                            </div>`;
                        }).join('')}
                        </div>
                    </div>
                </div>`;
            accordion.appendChild(card);
        }
    }

    // Compute matching recipes based on selected ingredients
    function findRecipes(selectedSet) {
        const results = [];
        recipesData.forEach(rec => {
            // Build ingredient set
            const ingSet = new Set(rec.ingredients.split(';').map(p => p.split(':')[0].trim().toLowerCase()));
            const needed = new Set([...ingSet].filter(x => !staples.includes(x)));
            let isFullMatch = true;
            needed.forEach(name => {
                if (!selectedSet.has(name)) isFullMatch = false;
            });
            if (isFullMatch) {
                results.push(Object.assign({matchType: 'full'}, rec));
            }
        });
        // If no full matches, find partial matches (at least one ingredient in common)
        if (results.length === 0 && selectedSet.size > 0) {
            recipesData.forEach(rec => {
                const ingSet = new Set(rec.ingredients.split(';').map(p => p.split(':')[0].trim().toLowerCase()));
                const common = [...ingSet].some(x => selectedSet.has(x));
                if (common) results.push(Object.assign({matchType: 'partial'}, rec));
            });
        }
        return results;
    }

    // Sort results by chosen key
    function sortResults(list, sortKey) {
        const sorted = list.slice();
        if (sortKey === 'protein') {
            sorted.sort((a,b) => b.protein - a.protein);
        } else if (sortKey === 'calories') {
            sorted.sort((a,b) => a.calories - b.calories);
        } else if (sortKey === 'carbs') {
            sorted.sort((a,b) => a.carbs - b.carbs);
        } else if (sortKey === 'fat') {
            sorted.sort((a,b) => a.fat - b.fat);
        } else if (sortKey === 'time') {
            sorted.sort((a,b) => a.time - b.time);
        }
        return sorted;
    }

    // Render results table
    function renderResults(recipes) {
        const tbody = document.querySelector('#resultsTable tbody');
        tbody.innerHTML = '';
        recipes.forEach(rec => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${rec.name}</td>
                <td>${rec.cuisine}</td>
                <td>${rec.time}</td>
                <td>${rec.protein.toFixed(1)}</td>
                <td>${rec.carbs.toFixed(1)}</td>
                <td>${rec.fat.toFixed(1)}</td>
                <td>${rec.calories.toFixed(1)}</td>
                <td class="instructions">${rec.instructions}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Event handlers
    document.addEventListener('DOMContentLoaded', () => {
        renderIngredientSelection();
        const findBtn = document.getElementById('findBtn');
        const backBtn = document.getElementById('backBtn');
        const selectionSection = document.getElementById('selection');
        const resultsSection = document.getElementById('results');
        const sortSelect = document.getElementById('sortSelect');
        let currentResults = [];

        findBtn.addEventListener('click', () => {
            // Gather selected ingredients
            const checked = document.querySelectorAll('#ingredientAccordion input[type=checkbox]:checked');
            const selectedSet = new Set();
            checked.forEach(cb => selectedSet.add(cb.value.toLowerCase()));
            currentResults = findRecipes(selectedSet);
            // Sort initial results by protein
            currentResults = sortResults(currentResults, sortSelect.value);
            renderResults(currentResults);
            // Toggle visibility
            selectionSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
        });
        backBtn.addEventListener('click', () => {
            resultsSection.classList.add('hidden');
            selectionSection.classList.remove('hidden');
        });
        sortSelect.addEventListener('change', () => {
            currentResults = sortResults(currentResults, sortSelect.value);
            renderResults(currentResults);
        });
    });
    </script>
